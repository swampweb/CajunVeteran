<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>Colors / Filament</title>
</head>
<body class="colors-page">
  <main class="v7-main colors-main">
    <div class="v7-container">
      <header class="v7-header colors-header">
        <div>
          <h1>Colors / Filament</h1>
          <p>Manage active filament colors, estimated grams, spool count, and low filament alerts</p>
        </div>
        <button class="btn primary" id="newColorBtn" type="button">+ New Color</button>
      </header>

      <section class="v7-card colors-card">
        <div class="v7-card-head">
          <h2 class="v7-panel-title">Filament Inventory</h2>
          <div class="color-filter-pills" role="group" aria-label="Color status filter">
            <button type="button" class="filter-pill active" data-filter="active">Active</button>
            <button type="button" class="filter-pill" data-filter="inactive">Inactive</button>
            <button type="button" class="filter-pill" data-filter="all">All</button>
          </div>
        </div>
        <div class="v7-card-body">
          <div class="colors-toolbar">
            <input id="colorSearch" type="search" placeholder="Search brand, color, type, or notes">
            <div class="filament-low-summary" id="filamentLowSummary">Low Filament: 0</div>
          </div>

          <form id="colorForm" class="form-panel color-form">
            <label>Brand<input id="brand" placeholder="Example: SUNLU"></label>
            <label>Color Name<input id="color" required placeholder="Example: Sunny Orange"></label>
            <label>Type<input id="type" placeholder="PLA, PETG, ABS"></label>
            <label class="num-field">Est. Grams<input id="estimated_grams" type="number" min="0" step="0.1" value="1000"></label>
            <label class="num-field">Spools<input id="spools" type="number" min="0" step="1" value="1"></label>
            <label class="num-field">Low At Grams<input id="low_grams" type="number" min="0" step="1" value="200"></label>
            <label>Status<select id="status"><option value="active">Active</option><option value="inactive">Inactive</option></select></label>
            <label class="full">Notes<textarea id="notes" placeholder="Optional notes"></textarea></label>
            <div class="actions full">
              <button class="btn clear" id="clearColor" type="button">Clear</button>
              <button class="btn primary" type="submit">Save Color</button>
              <button class="btn danger hidden" id="deleteColor" type="button">Delete</button>
            </div>
          </form>

          <div id="colorsGrid" class="colors-grid"></div>
        </div>
      </section>
    </div>
  </main>
  <footer class="v7-footer">CajunVeteran Workshop Management - Built By A Veteran</footer>
  <script src="js/database.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/colors.js"></script>
</body>
</html>
