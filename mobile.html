<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/mobile.css">
  <title>CajunVeteran Mobile Jobs</title>
</head>
<body>
  <main class="mobile-shell">
    <header class="mobile-topbar">
      <div class="mobile-header-spacer" aria-hidden="true"></div>
      <div>
        <div class="mobile-brand">CajunVeteran Workshop</div>
        <h1 id="screenTitle">Active Jobs</h1>
      </div>
      <img class="mobile-logo" src="images/apple-touch-icon.png" alt="CajunVeteran">
    </header>

    <section class="mobile-view active" id="viewDashboard">
      <div class="mobile-kpis">
        <article class="mobile-kpi print"><span>Active 3D Print</span><strong id="kpiPrintActive">0</strong></article>
        <article class="mobile-kpi wood"><span>Active Wood</span><strong id="kpiWoodActive">0</strong></article>
        <article class="mobile-kpi done"><span>Completed</span><strong id="kpiCompleted">0</strong></article>
        <article class="mobile-kpi warn"><span>Delivered</span><strong id="kpiDelivered">0</strong></article>
      </div>

      <div class="mobile-section-head">
        <h2>Newest Active</h2>
        <button class="text-btn" type="button" data-go="jobs">View All</button>
      </div>
      <div class="mobile-list" id="upcomingList"></div>
      <button class="action-btn image-manager-home" type="button" data-view="itemImages">📷 Manage Item Images</button>
    </section>

    <section class="mobile-view" id="viewJobs">
      <div class="filter-row type-filter">
        <button class="filter-pill active" type="button" data-type="all">All</button>
        <button class="filter-pill" type="button" data-type="print">3D Print <b id="typePrintCount">0</b></button>
        <button class="filter-pill" type="button" data-type="wood">Woodworking <b id="typeWoodCount">0</b></button>
      </div>

      <div class="filter-row status-filter">
        <button class="filter-pill active" type="button" data-status="active">Active</button>
        <button class="filter-pill" type="button" data-status="completed">Completed</button>
        <button class="filter-pill" type="button" data-status="delivered">Delivered</button>
        <button class="filter-pill" type="button" data-status="all">All</button>
      </div>

      <div class="mobile-search-row">
        <input id="mobileJobSearch" type="search" placeholder="Search job #, customer, or item...">
        <button class="icon-btn" id="clearSearch" type="button" aria-label="Clear search">×</button>
      </div>

      <div class="mobile-list" id="mobileJobList"></div>
    </section>



    <section class="mobile-view" id="viewItemImages">
      <button class="back-btn" id="itemImagesBack" type="button">‹ Back</button>
      <div class="item-image-manager">
        <h2>Item Images</h2>
        <div class="filter-row type-filter image-type-filter">
          <button class="filter-pill active" type="button" data-image-list="print">3D Print Items</button>
          <button class="filter-pill" type="button" data-image-list="wood">Woodworking Items</button>
        </div>
        <div class="mobile-search-row big">
          <input id="itemImageSearch" type="search" placeholder="Search item name, SKU, or item #...">
        </div>
        <div class="mobile-list" id="itemImageList"></div>
      </div>
    </section>

    <section class="mobile-view" id="viewEditItemImage">
      <button class="back-btn" id="editItemImageBack" type="button">‹ Back</button>
      <div class="item-image-editor">
        <h2>Edit Item Image</h2>
        <div id="itemImageEditorBody"></div>
      </div>
    </section>

    <section class="mobile-view" id="viewNewOrder">
      <button class="back-btn" id="newOrderBack" type="button">‹ Back</button>
      <div class="mobile-wizard-head">
        <h2>Add New Order</h2>
        <div class="wizard-steps"><span class="active" data-step-dot="1">1</span><span data-step-dot="2">2</span><span data-step-dot="3">3</span></div>
      </div>
      <form id="mobileOrderForm" class="mobile-order-form">
        <section class="wizard-step active" data-step="1">
          <h3>Order Information</h3>
          <label>Order Type
            <div class="segmented"><button class="seg active" type="button" data-order-type="print">3D Print</button><button class="seg" type="button" data-order-type="wood">Woodworking</button></div>
          </label>
          <label>Customer <input id="mCustomer" required placeholder="Customer name"></label>
          <label>Order Date <input id="mOrderDate" type="date" required></label>
          <label>Due Date <input id="mDueDate" type="date"></label>
          <label>Status <select id="mStatus"><option value="new">New</option><option value="in_process">In Process</option></select></label>
          <label>Priority <select id="mPriority"><option value="2">Normal</option><option value="1">Rush</option><option value="3">Whenever</option></select></label>
          <label>Notes <textarea id="mNotes" placeholder="Optional notes..."></textarea></label>
          <button class="action-btn primary" type="button" data-next-step="2">Next: Add Order Item</button>
        </section>
        <section class="wizard-step" data-step="2">
          <h3>Add Order Item</h3>
          <label>Select Item <select id="mItemSelect"></select></label>
          <div class="mobile-item-preview" id="mItemPreview"></div>
          <label>Quantity <input id="mQty" type="number" min="1" value="1"></label>
          <label id="mColorWrap">Colors <select id="mColorSelect" multiple></select></label>
          <button class="action-btn primary" type="button" data-next-step="3">Next: Review Order</button>
          <button class="action-btn" type="button" data-prev-step="1">Back</button>
        </section>
        <section class="wizard-step" data-step="3">
          <h3>Review Order</h3>
          <div id="mReviewBox" class="review-box"></div>
          <button class="action-btn done" type="submit">Create Order</button>
          <button class="action-btn" type="button" data-prev-step="2">Back</button>
        </section>
      </form>
    </section>



    <section class="mobile-view" id="viewDetail">
      <button class="back-btn" id="detailBack" type="button">‹ Back</button>
      <div id="mobileJobDetail"></div>
    </section>


  </main>

  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <button class="nav-btn active" type="button" data-view="dashboard"><span>🏠</span>Home</button>
    <button class="nav-btn" type="button" data-view="jobs" data-nav-status="active"><span>🔥</span>Active</button>
    <button class="nav-btn" type="button" data-view="jobs" data-nav-status="completed"><span>✅</span>Completed</button>
    <button class="nav-btn" type="button" data-view="jobs" data-nav-status="delivered"><span>📦</span>Delivered</button>
    <button class="nav-btn new-order-nav" type="button" data-view="newOrder"><span>➕</span>New Order</button>
  </nav>

  <script src="js/database.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/mobile.js"></script>
</body>
</html>
